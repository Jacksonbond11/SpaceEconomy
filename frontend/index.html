<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <!-- Primary SEO -->
    <title>Space Economy — Space Stock Tracker | Invest in Space</title>
    <meta name="description" content="Track space stocks, aerospace ETFs, and space economy companies on an interactive orbital map. Live prices, market caps, and news for retail investors in the space sector — from launch providers to satellite operators." />
    <meta name="keywords" content="space stocks, space economy investing, aerospace ETFs, space industry stocks, invest in space companies, satellite stocks, launch company stocks, space sector investing, SPCE, RKLB, ASTS" />
    <link rel="canonical" href="https://spaceeconomy.app" />

    <!-- Favicon -->
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />

    <!-- Open Graph -->
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://spaceeconomy.app" />
    <meta property="og:site_name" content="Space Economy" />
    <meta property="og:title" content="Space Economy — Space Stock Tracker" />
    <meta property="og:description" content="Interactive orbital map of publicly traded space companies. Live stock prices, market caps, and sector news for space economy investors." />
    <meta property="og:image" content="/og-image.svg" />
    <meta property="og:image:alt" content="Orbital map of space economy companies" />

    <!-- Twitter Card -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Space Economy — Space Stock Tracker" />
    <meta name="twitter:description" content="Interactive orbital map of publicly traded space companies. Live stock prices, market caps, and sector news for space economy investors." />
    <meta name="twitter:image" content="/og-image.svg" />
    <meta name="twitter:image:alt" content="Orbital map of space economy companies" />

    <!-- JSON-LD structured data -->
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "WebSite",
      "name": "Space Economy",
      "url": "https://spaceeconomy.app",
      "description": "Interactive orbital map of publicly traded space companies. Track space stocks, aerospace ETFs, and space economy investments with live market data.",
      "about": {
        "@type": "Thing",
        "name": "Space Economy Investing",
        "description": "Investing in publicly traded companies operating in the space industry, including launch providers, satellite operators, and aerospace manufacturers."
      },
      "potentialAction": {
        "@type": "SearchAction",
        "target": {
          "@type": "EntryPoint",
          "urlTemplate": "https://spaceeconomy.app?search={search_term_string}"
        },
        "query-input": "required name=search_term_string"
      }
    }
    </script>

    <!-- Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
