services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: massive
      POSTGRES_USER: massive
      POSTGRES_PASSWORD: massive
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U massive"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    image: jacksonbond11/space-economy-api:latest
    restart: unless-stopped
    ports:
      - "5038:8080"
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      ConnectionStrings__Default: "Host=db;Database=massive;Username=massive;Password=massive"
      Polygon__ApiKey: "${POLYGON_API_KEY}"
      Cors__AllowedOrigin: "${CORS_ALLOWED_ORIGIN:-http://localhost:5173}"
    depends_on:
      db:
        condition: service_healthy

volumes:
  pgdata:
